worker_processes auto;
events { worker_connections 1024; }
http {
  # Deliberately omit URLs, query strings, addresses and headers from logs.
  log_format safe '{"event":"http","status":$status,"duration":$request_time}';
  access_log /dev/stdout safe;
  error_log /dev/stderr crit;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=credentials:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=uploads:10m rate=10r/m;
  limit_req_status 429;
  client_max_body_size 64k;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  server { listen 80 default_server; server_name _; return 444; }
  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    return 444;
  }
  server {
    listen 80;
    server_name ${PUBLIC_HOSTNAME};
    return 308 https://${PUBLIC_HOSTNAME}$request_uri;
  }
  server {
    listen 443 ssl;
    server_name ${PUBLIC_HOSTNAME};
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Next.js emits inline hydration scripts; a stricter nonce CSP needs a separate reviewed implementation.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
    error_page 429 = @limited;
    error_page 413 = @large;
    location @limited { default_type application/json; add_header Retry-After 60 always; return 429 '{"success":false,"error":"Too many requests. Try again shortly."}'; }
    location @large { default_type application/json; return 413 '{"success":false,"error":"Request body too large"}'; }
    location ~ ^/(?:uploads(?:/|$)|\.env|storage(?:/|$)|prisma(?:/|$)|scripts(?:/|$)) { return 404; }
    location ~ ^/api/auth/(?:login|register|forgot-password|reset-password|invitation)$ {
      limit_req zone=credentials burst=20 nodelay;
      include /etc/nginx/proxy-common.conf;
    }
    location = /api/upload {
      client_max_body_size 26m;
      limit_req zone=uploads burst=10 nodelay;
      include /etc/nginx/proxy-common.conf;
    }
    location / { include /etc/nginx/proxy-common.conf; }
  }
}
